[theme]
base = "dark"
primaryColor = "#DAF995"
backgroundColor = "#101613"
secondaryBackgroundColor = "#171F1B"
textColor = "#EFF4EE"
borderColor = "#65786A"
dataframeBorderColor = "#303C33"
dataframeHeaderBackgroundColor = "#1D2821"
showWidgetBorder = true
baseRadius = "8px"
font = "sans-serif"

[browser]
gatherUsageStats = false

[server]
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1
