[theme]
# Blaugrana — navy ground, garnet accent, gold reserved for captain/star emphasis in app.py
primaryColor = "#D64B5E"
backgroundColor = "#0F1420"
secondaryBackgroundColor = "#1A2235"
textColor = "#F2F4F8"

[browser]
gatherUsageStats = false

[server]
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1
